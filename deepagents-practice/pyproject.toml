[project]
name = "deepagents-practice"
version = "0.1.0"
description = "从零复现《Deep Agents 实战》的实验"
requires-python = ">=3.12,<3.13"
# 版本刻意锁死成和课程正文一致，保证你观察到的现象对得上讲解。
dependencies = [
  "deepagents==0.7.22",
  "langchain==1.4.3",
  "langgraph==1.2.13",
  "langchain-core==1.6.6",
  "langchain-openai==1.6.7",
  "python-dotenv>=1.2.4,<2",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]

[tool.uv]
# 这是一个"应用"而不是"包"：不需要 src 布局，根目录下直接写 .py 就行
package = false
